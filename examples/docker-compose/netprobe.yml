# Example configuration for the Prometheus and Grafana stack.
#
# The `scope` and `provider` labels drive the dashboard filters. Rename them
# here and the dashboard variables need renaming too.

listen: ":9427"
privileged: true

defaults:
  interval: 15s
  timeout: 2s
  count: 5

# Feeds the "path and hops" dashboard, for the targets that opt in below.
traceroute:
  interval: 60s
  timeout: 1s
  max_hops: 20

# Feeds the "access link" dashboard: the public address, and every time it
# changes because the link renegotiated. Remove this block to stop the exporter
# contacting a third party server.
wan:
  server: stun.l.google.com:19302
  interval: 60s

targets:
  - name: gateway
    host: 192.168.1.1
    labels: { scope: local, provider: lan }
    probes: [icmp]

  - name: cloudflare-dns
    host: 1.1.1.1
    labels: { scope: internet, provider: cloudflare }
    probes: [icmp, "tcp:443"]
    traceroute: true

  - name: quad9-dns
    host: 9.9.9.9
    labels: { scope: internet, provider: quad9 }
    probes: [icmp, "tcp:443"]

  # Probed over both ICMP and TCP, which is what the "TCP minus ICMP" panel
  # compares, and over both address families, which is what makes a broken
  # IPv6 path visible instead of hidden behind a happy-eyeballs fallback.
  - name: example-site
    host: www.example.com
    labels: { scope: internet, provider: example }
    probes: [icmp, "tcp:443"]
    families: [ipv4, ipv6]
    traceroute: true

  # A third field pins the local source port instead of taking an ephemeral one,
  # so a firewall rule or an ACL on the path can match the probe:
  #
  # - name: partner-api
  #   host: api.example.net
  #   labels: { scope: internet, provider: example }
  #   probes: ["tcp:443:50000"] # destination 443, source 50000

  # A real DNS query for www.example.com; a silent open port would otherwise
  # look like 100% loss.
  - name: google-dns
    host: 8.8.8.8
    labels: { scope: internet, provider: google }
    probes: ["udp:53"]
    payload: "abcd0100000100000000000003777777076578616d706c6503636f6d0000010001"
