# netprobe-exporter configuration.
#
# Every target needs a host and at least one probe. Labels are free-form and are
# attached to every metric of that target.
#
# Probe syntax: icmp | tcp:<port>[:<local port>] | udp:<port>[:<local port>]
#
# The port after the protocol is the destination. A third field pins the local
# source port, which is otherwise picked from the ephemeral range.

listen: ":9427"
privileged: true # raw ICMP sockets; see README for the unprivileged mode

defaults:
  interval: 15s # one probing cycle per target and protocol
  timeout: 2s # per sample
  count: 5 # samples per cycle

# Path probing, for the targets that opt in with "traceroute: true". A trace
# costs up to max_hops timeouts, so it runs far less often than a probe.
traceroute:
  interval: 60s
  timeout: 1s
  max_hops: 20

# Public address lookup over STUN, which is what detects an access link
# reconnecting. Disabled until a server is named: the exporter should not talk
# to a third party the operator did not choose.
wan:
  server: stun.l.google.com:19302
  interval: 60s

targets:
  # A local reference separates "my uplink is down" from "the remote is down".
  - name: gateway
    host: 192.168.1.1
    labels: { scope: local }
    probes: [icmp]

  - name: cloudflare-dns
    host: 1.1.1.1
    labels: { scope: internet, provider: cloudflare }
    probes: [icmp, "tcp:443"]
    traceroute: true # walk the route and report where the latency appears

  # Probing the same target over ICMP and TCP exposes the difference between
  # the control plane and the data plane. Listing both families probes the A
  # and the AAAA record separately, which is what makes a broken IPv6 path
  # visible instead of hidden behind a happy-eyeballs fallback.
  - name: example-site
    host: www.example.com
    labels: { scope: internet, provider: example }
    probes: [icmp, "tcp:443"]
    families: [ipv4, ipv6]

  # A third field pins the local source port, which a firewall rule or an ACL on
  # the path can then match. Use a port outside the ephemeral range, and a
  # different one per probe: two probes sharing a source port collide.
  #
  # - name: partner-api
  #   host: api.example.net
  #   labels: { scope: internet, provider: example }
  #   probes: ["tcp:443:50000"] # destination 443, source 50000

  # UDP probes need a payload the service actually answers. This one is an A
  # query for www.example.com; without it a silent open port looks like 100%
  # loss. See the UDP section of the README.
  - name: google-dns
    host: 8.8.8.8
    labels: { scope: internet, provider: google }
    probes: ["udp:53"]
    payload: "abcd0100000100000000000003777777076578616d706c6503636f6d0000010001"
